[project]
name = "online-judge"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=4.2,<5",
    "django_compressor>=3",
    "django-mptt>=0.13",
    "django-registration-redux>=2.10",
    "django-reversion>=5",
    "django-social-share",
    "django-sortedm2m>=3.1.0",
    "django-impersonate",
    "dmoj-wpadmin",
    "lxml",
    "lxml_html_clean",
    "Pygments",
    "mistune<2",
    "social-auth-core==4.3.0",
    "social-auth-app-django==5.0.0",
    "pytz",
    "django-statici18n",
    "pika",
    "ua-parser",
    "pyyaml",
    "jinja2",
    "django_jinja>=2.5.0",
    "llist",
    "requests",
    "django-fernet-fields",
    "pyotp",
    "qrcode[pil]",
    # qrcode[pil] pulls Pillow in; 13.0.0 contains the October 2026 security fixes
    "pillow>=13.0.0",
    "jsonfield",
    "pymoss",
    "packaging<22",
    "celery",
    "ansi2html",
    "sqlparse",
    "lupa",
    "netaddr",
    "webauthn<1",
    "bleach[css]",
    "django-admin-sortable2",
    "icalendar",
    # This is a celery dependency whose latest major version is breaking everything.
    "importlib-metadata<5",
]

[project.optional-dependencies]
mysql = ["mysqlclient"]

[dependency-groups]
dev = [
    "flake8",
    "flake8-import-order",
    "flake8-future-import",
    "flake8-commas",
    "flake8-logging-format",
    "flake8-quotes",
    "coverage",
    "pymysql",
    # flake8-logging-format imports pkg_resources, which setuptools 81 and later no longer ships
    "setuptools<81",
]

[tool.uv]
package = false

[tool.uv.sources]
dmoj-wpadmin = { git = "https://github.com/DMOJ/dmoj-wpadmin.git" }
django-fernet-fields = { git = "https://github.com/DMOJ/django-fernet-fields.git" }
jsonfield = { git = "https://github.com/DMOJ/jsonfield.git" }
ansi2html = { git = "https://github.com/DMOJ/ansi2html.git" }
